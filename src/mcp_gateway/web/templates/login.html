{% extends "base.html" %}
{% block title %}Login - MCP Gateway Admin{% endblock %}
{% block content %}
<div class="min-h-[80vh] flex items-center justify-center">
  <div class="w-full max-w-md bg-slate-950 border border-slate-800 rounded-xl p-8 shadow-2xl space-y-6">
    <div class="text-center space-y-2">
      <div class="w-12 h-12 rounded-xl bg-indigo-600 flex items-center justify-center font-bold text-white text-xl mx-auto shadow-lg">
        π
      </div>
      <h1 class="text-xl font-bold tracking-tight text-white">MCP Gateway Console</h1>
      <p class="text-xs text-slate-400">Authenticated Access Required</p>
    </div>

    {% if error %}
    <div class="p-3 bg-rose-950/80 border border-rose-800 text-rose-300 text-sm rounded-lg">
      {{ error }}
    </div>
    {% endif %}

    <form method="POST" action="{{ url_for('auth.login', next=request.args.get('next')) }}" class="space-y-4">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <div>
        <label for="username" class="block text-xs font-medium text-slate-300 mb-1">Username</label>
        <input type="text" id="username" name="username" required autofocus class="w-full px-3 py-2 bg-slate-900 border border-slate-800 rounded-lg text-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-indigo-500 text-sm">
      </div>
      <div>
        <label for="password" class="block text-xs font-medium text-slate-300 mb-1">Password</label>
        <input type="password" id="password" name="password" required class="w-full px-3 py-2 bg-slate-900 border border-slate-800 rounded-lg text-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-indigo-500 text-sm">
      </div>
      <button type="submit" class="w-full py-2.5 px-4 bg-indigo-600 hover:bg-indigo-500 text-white font-medium rounded-lg text-sm transition shadow-lg">
        Sign In
      </button>
    </form>
    <div class="text-center text-xs text-slate-500">
      Localhost only (127.0.0.1:8080) via SSH Tunnel
    </div>
  </div>
</div>
{% endblock %}
